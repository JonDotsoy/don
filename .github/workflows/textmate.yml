name: TextMate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ide/textmate/**
      - .github/workflows/textmate.yml
  push:
    branches:
      - develop
    paths:
      - ide/textmate/**
      - .github/workflows/textmate.yml

jobs:
  validate-grammar:
    name: Validate DON TextMate grammar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate grammar structure
        run: bun ide/textmate/scripts/validate-grammar.ts

      - name: Install grammar test dependencies
        working-directory: ide/textmate
        run: bun install --frozen-lockfile

      - name: Run vscode-tmgrammar-test suite
        working-directory: ide/textmate
        run: bunx vscode-tmgrammar-test 'tests/unit/**/*.test.don'
