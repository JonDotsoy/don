<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>donly.</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 800;
        font-style: normal;
        src:
          local("JetBrains Mono ExtraBold"), local("JetBrainsMono-ExtraBold");
      }

      :root {
        --bg-1: #f6f4ef;
        --bg-2: #eae6dc;
        --text: #181511;
        --accent: #c1611f;
        --accent-2: #1f5fa8;
        --line: rgba(20, 17, 10, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-1: #0d1117;
          --bg-2: #141a22;
          --text: #e6edf3;
          --accent: #ffa657;
          --accent-2: #79c0ff;
          --line: rgba(255, 255, 255, 0.09);
        }
      }

      :root[data-theme="dark"] {
        --bg-1: #0d1117;
        --bg-2: #141a22;
        --text: #e6edf3;
        --accent: #ffa657;
        --accent-2: #79c0ff;
        --line: rgba(255, 255, 255, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cover {
        position: relative;
        width: 1200px;
        height: 630px;
        max-width: 100%;
        aspect-ratio: 1200 / 630;
        border-radius: 20px;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cover::before {
        /* grid overlay */
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(
          ellipse at center,
          black 55%,
          transparent 100%
        );
        -webkit-mask-image: radial-gradient(
          ellipse at center,
          black 55%,
          transparent 100%
        );
      }

      .cover::after {
        /* soft radial glow in corners */
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            420px 320px at 0% 0%,
            color-mix(in srgb, var(--accent-2) 22%, transparent),
            transparent 60%
          ),
          radial-gradient(
            420px 320px at 100% 100%,
            color-mix(in srgb, var(--accent) 18%, transparent),
            transparent 60%
          );
      }

      .wordmark {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: baseline;
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: clamp(64px, 15vw, 168px);
        line-height: 1;
        color: var(--text);
        user-select: none;
      }

      .wordmark .dot {
        color: var(--accent);
        margin-left: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="cover" id="cover">
      <div class="wordmark">donly<span class="dot">.</span></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    </script>
  </body>
</html>
